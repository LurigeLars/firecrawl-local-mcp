# Local overrides layered on top of firecrawl/docker-compose.yaml (upstream stays untouched).
services:
  # FoundationDB is only needed with NUQ_BACKEND=fdb; keep it off by default.
  foundationdb:
    profiles: ["fdb"]
  foundationdb-init:
    profiles: ["fdb"]
  api:
    user: node
    restart: unless-stopped
    # Wrapper-owned DoS blast-radius limits. Keep these explicit even while
    # upstream currently ships the same CPU/RAM caps.
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_PASSWORD: ""
    tmpfs:
      - /run/firecrawl-secrets:rw,nosuid,nodev,noexec,size=64k,uid=1000,gid=1000,mode=0700
    post_start:
      - command:
          - sh
          - -c
          - >-
            umask 077;
            test -n "$$FIRECRAWL_POSTGRES_PASSWORD_SECRET";
            printf '%s' "$$FIRECRAWL_POSTGRES_PASSWORD_SECRET" > /run/firecrawl-secrets/postgres_password
        environment:
          FIRECRAWL_POSTGRES_PASSWORD_SECRET: ${FIRECRAWL_POSTGRES_PASSWORD_SECRET:?PostgreSQL runtime secret is required}
    command:
      - sh
      - -c
      - >-
        while [ ! -s /run/firecrawl-secrets/postgres_password ]; do sleep 0.05; done;
        export POSTGRES_PASSWORD="$$(cat /run/firecrawl-secrets/postgres_password)";
        exec node dist/src/harness.js --start-docker
  playwright-service:
    restart: unless-stopped
    # Keep Firecrawl API traffic on backend, but give browser egress a dual-stack path.
    networks: [backend, browser_dualstack]
    dns:
      - 172.64.36.1
      - 172.64.36.2
    # Wrapper-owned DoS blast-radius limits. The PID cap is local hardening;
    # CPU/RAM values intentionally match the current upstream defaults.
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    pids_limit: 512
    # Taller browser viewport so virtualized pages/lists render all rows.
    # Upstream hard-codes 1280x800; patch the compiled file at start-up (warns if upstream changed the line).
    environment:
      VIEWPORT_HEIGHT: ${PLAYWRIGHT_VIEWPORT_HEIGHT:-4000}
    command:
      - sh
      - -c
      - >-
        sed -i 's/const viewport = { width: 1280, height: 800 };/const viewport = { width: 1280, height: Number(process.env.VIEWPORT_HEIGHT || 800) };/' dist/api.js;
        grep -q 'process.env.VIEWPORT_HEIGHT' dist/api.js || echo 'WARNING: viewport patch not applied (upstream changed dist/api.js)' >&2;
        exec node dist/api.js
  # Ephemeral stateful research browser. This is intentionally separate from
  # Firecrawl's one-shot Playwright scraper and from authenticated supplier sessions.
  # The service accepts only public HTTP(S) targets, keeps no persistent profile,
  # redacts network output and is reachable from the host on loopback only.
  browser-session-service:
    build: apps/playwright-service-ts
    restart: unless-stopped
    dns:
      - 172.64.36.1
      - 172.64.36.2
    cpus: 1.0
    mem_limit: 2G
    memswap_limit: 2G
    pids_limit: 384
    shm_size: 512m
    environment:
      PORT: "3010"
      HOST: "0.0.0.0"
      HOME: /tmp
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-2}
      BROWSER_MAX_TABS_PER_SESSION: ${BROWSER_MAX_TABS_PER_SESSION:-3}
      BROWSER_SESSION_TTL_MS: ${BROWSER_SESSION_TTL_MS:-600000}
      BROWSER_SESSION_IDLE_MS: ${BROWSER_SESSION_IDLE_MS:-300000}
      BROWSER_PROCESS_IDLE_MS: ${BROWSER_PROCESS_IDLE_MS:-60000}
      BROWSER_NAVIGATION_TIMEOUT_MS: ${BROWSER_NAVIGATION_TIMEOUT_MS:-30000}
    command: ["node", "local-browser/service.mjs"]
    volumes:
      - ../browser:/usr/src/app/local-browser:ro
    ports:
      - "127.0.0.1:${BROWSER_SESSION_HOST_PORT:-3010}:3010"
    networks: [browser_dualstack]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,uid=1000,gid=1000,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Public-only browser fallback. The router always tries the normal Playwright service first.
  # Only allowlisted public hostnames may retry through this proxy service after target HTTP 403/429.
  # Auth/session-bearing requests fail closed and are never sent to the third-party proxy.
  playwright-public-proxy-service:
    profiles: ["public-proxy"]
    build: apps/playwright-service-ts
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2G
    memswap_limit: 2G
    pids_limit: 256
    environment:
      PORT: 3000
      PROXY_SERVER: ""
      PROXY_USERNAME: ""
      PROXY_PASSWORD: ""
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS:-false}
      BLOCK_MEDIA: ${BLOCK_MEDIA:-false}
      MAX_CONCURRENT_PAGES: ${PUBLIC_PROXY_MAX_CONCURRENT_PAGES:-2}
      VIEWPORT_HEIGHT: ${PLAYWRIGHT_VIEWPORT_HEIGHT:-4000}
    tmpfs:
      - /run/firecrawl-secrets:rw,nosuid,nodev,noexec,size=64k,uid=1000,gid=1000,mode=0700
    post_start:
      - command:
          - sh
          - -c
          - >-
            umask 077;
            test -n "$FIRECRAWL_PUBLIC_PROXY_SERVER_SECRET";
            test -n "$FIRECRAWL_PUBLIC_PROXY_USERNAME_SECRET";
            test -n "$FIRECRAWL_PUBLIC_PROXY_PASSWORD_SECRET";
            printf '%s' "$FIRECRAWL_PUBLIC_PROXY_SERVER_SECRET" > /run/firecrawl-secrets/proxy_server;
            printf '%s' "$FIRECRAWL_PUBLIC_PROXY_USERNAME_SECRET" > /run/firecrawl-secrets/proxy_username;
            printf '%s' "$FIRECRAWL_PUBLIC_PROXY_PASSWORD_SECRET" > /run/firecrawl-secrets/proxy_password
        environment:
          FIRECRAWL_PUBLIC_PROXY_SERVER_SECRET: ${FIRECRAWL_PUBLIC_PROXY_SERVER_SECRET:-}
          FIRECRAWL_PUBLIC_PROXY_USERNAME_SECRET: ${FIRECRAWL_PUBLIC_PROXY_USERNAME_SECRET:-}
          FIRECRAWL_PUBLIC_PROXY_PASSWORD_SECRET: ${FIRECRAWL_PUBLIC_PROXY_PASSWORD_SECRET:-}
    command:
      - sh
      - -c
      - >-
        while [ ! -s /run/firecrawl-secrets/proxy_server ] ||
              [ ! -s /run/firecrawl-secrets/proxy_username ] ||
              [ ! -s /run/firecrawl-secrets/proxy_password ]; do sleep 0.05; done;
        export PROXY_SERVER="$(cat /run/firecrawl-secrets/proxy_server)";
        export PROXY_USERNAME="$(cat /run/firecrawl-secrets/proxy_username)";
        export PROXY_PASSWORD="$(cat /run/firecrawl-secrets/proxy_password)";
        sed -i 's/const viewport = { width: 1280, height: 800 };/const viewport = { width: 1280, height: Number(process.env.VIEWPORT_HEIGHT || 800) };/' dist/api.js;
        grep -q 'process.env.VIEWPORT_HEIGHT' dist/api.js || echo 'WARNING: viewport patch not applied (upstream changed dist/api.js)' >&2;
        exec node dist/api.js
    networks: [backend]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  public-proxy-metrics-init:
    profiles: ["public-proxy"]
    image: node:26.10.0-alpine
    user: root
    command: ["sh", "-c", "chown 1000:1000 /var/lib/firecrawl-proxy"]
    volumes:
      - public-proxy-metrics:/var/lib/firecrawl-proxy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"

  playwright-router:
    profiles: ["public-proxy"]
    image: node:26.10.0-alpine
    user: node
    cpus: 0.25
    mem_limit: 128M
    memswap_limit: 128M
    pids_limit: 64
    environment:
      PORT: 3000
      DIRECT_UPSTREAM: http://playwright-service:3000/scrape
      PROXY_UPSTREAM: http://playwright-public-proxy-service:3000/scrape
      PUBLIC_PROXY_HOSTS: ${FIRECRAWL_PUBLIC_PROXY_HOSTS:-curemydisease.com}
      PUBLIC_PROXY_ATTEMPTS: ${FIRECRAWL_PUBLIC_PROXY_ATTEMPTS:-3}
      PUBLIC_PROXY_METRICS_PATH: /var/lib/firecrawl-proxy/metrics.json
    command: ["node", "/app/public-proxy-router.mjs"]
    volumes:
      - ../playwright:/app:ro
      - public-proxy-metrics:/var/lib/firecrawl-proxy
    networks: [backend]
    depends_on:
      playwright-service:
        condition: service_started
      playwright-public-proxy-service:
        condition: service_started
      public-proxy-metrics-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  public-proxy-smoke:
    profiles: ["smoke"]
    image: node:26.10.0-alpine
    user: node
    command: ["node", "/app/public-proxy-live-smoke.mjs"]
    environment:
      ROUTER_URL: http://playwright-router:3000
    volumes:
      - ../playwright:/app:ro
    networks: [backend]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  redis:
    image: redis:8.10.2-alpine
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  nuq-postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/firecrawl-secrets/postgres_password
    tmpfs:
      - /run/firecrawl-secrets:rw,nosuid,nodev,noexec,size=64k,uid=0,gid=0,mode=0700
    post_start:
      - command:
          - sh
          - -c
          - >-
            umask 077;
            test -n "$$FIRECRAWL_POSTGRES_PASSWORD_SECRET";
            printf '%s' "$$FIRECRAWL_POSTGRES_PASSWORD_SECRET" > /run/firecrawl-secrets/postgres_password
        environment:
          FIRECRAWL_POSTGRES_PASSWORD_SECRET: ${FIRECRAWL_POSTGRES_PASSWORD_SECRET:?PostgreSQL runtime secret is required}
    entrypoint:
      - sh
      - -c
      - >-
        while [ ! -s /run/firecrawl-secrets/postgres_password ]; do sleep 0.05; done;
        exec docker-entrypoint.sh postgres

  # Search backend for Firecrawl (SEARXNG_ENDPOINT in .env). Internal network only, no host port.
  searxng:
    image: searxng/searxng:2026.9.10-931fd9787
    user: "977:977"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        while [ ! -s /run/firecrawl-secrets/searxng_secret ]; do sleep 0.05; done;
        export SEARXNG_SECRET="$$(cat /run/firecrawl-secrets/searxng_secret)";
        exec /usr/local/searxng/entrypoint.sh
    environment:
      SEARXNG_SECRET: ""
      SEARXNG_BASE_URL: http://searxng:8080/
      FORCE_OWNERSHIP: "false"
    tmpfs:
      - /run/firecrawl-secrets:rw,nosuid,nodev,noexec,size=64k,uid=977,gid=977,mode=0700
    post_start:
      - command:
          - /bin/sh
          - -c
          - >-
            umask 077;
            test -n "$$FIRECRAWL_SEARXNG_SECRET_SECRET";
            printf '%s' "$$FIRECRAWL_SEARXNG_SECRET_SECRET" > /run/firecrawl-secrets/searxng_secret
        environment:
          FIRECRAWL_SEARXNG_SECRET_SECRET: ${FIRECRAWL_SEARXNG_SECRET_SECRET:?SearXNG runtime secret is required}
    volumes:
      - ../searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ../searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    networks: [backend]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Routes Firecrawl searches: Google+Startpage (language all) first, Bing (en-GB) as fallback; handles site: filters.
  searxng-proxy:
    image: node:26.10.0-alpine
    command: ["node", "/app/lang-proxy.mjs"]
    user: node
    environment:
      UPSTREAM: http://searxng:8080
    volumes:
      - ../searxng/lang-proxy.mjs:/app/lang-proxy.mjs:ro
    networks: [backend]
    depends_on: [searxng]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Sends LLM calls to Gemini when the runtime secret is present, else/fallback to Ollama with trimmed prompts (llm/trim-proxy.mjs).
  llm-proxy:
    image: node:26.10.0-alpine
    command: ["node", "/app/trim-proxy.mjs"]
    user: node
    environment:
      MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-7000}
      # Optional: Gemini first when the runtime tmpfs secret is present; local model remains fallback.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    volumes:
      - ../llm:/app:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [backend]
    read_only: true
    tmpfs:
      - /run/firecrawl-secrets:rw,nosuid,nodev,noexec,size=64k,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  browser_dualstack:
    driver: bridge
    enable_ipv6: true

volumes:
  public-proxy-metrics:
