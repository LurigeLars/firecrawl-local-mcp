services:
  smoke:
    image: node:26.10.0-alpine
    command:
      - sh
      - -c
      - >-
        while [ ! -s /run/firecrawl-secrets/value ]; do sleep 0.05; done;
        sleep infinity
    tmpfs:
      - /run/firecrawl-secrets:rw,nosuid,nodev,noexec,size=64k,mode=0777
    post_start:
      - command:
          - sh
          - -c
          - >-
            umask 077;
            test -n "$$SMOKE_SECRET";
            printf '%s' "$$SMOKE_SECRET" > /run/firecrawl-secrets/value
        environment:
          SMOKE_SECRET: ${SMOKE_SECRET:?runtime smoke secret is required}
