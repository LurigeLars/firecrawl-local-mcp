name: Temporary public npm lock generator

on:
  pull_request:
    paths:
      - "public/package.json"
      - ".github/workflows/tmp-generate-public-lock.yml"

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Generate package-lock.json
        working-directory: public
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- public/package-lock.json)" ]]; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/package-lock.json
          git commit -m "chore: add public npm lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
