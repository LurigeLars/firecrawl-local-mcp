name: Temporary hardened Firecrawl NuQ validation

on:
  push:
    branches:
      - fix/scout-runtime-hardening-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuq:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Clone pinned Firecrawl source
        run: git clone --depth 1 --branch v2.11.376 https://github.com/firecrawl/firecrawl.git upstream

      - name: Build hardened NuQ Postgres image
        run: docker build --pull -f "$GITHUB_WORKSPACE/hardening/Dockerfile.nuq-postgres" -t firecrawl-nuq-postgres-hardened "$GITHUB_WORKSPACE/upstream/apps/nuq-postgres"

      - name: Smoke hardened NuQ Postgres image
        run: |
          docker run -d --rm --name nuq-hardening-test             -e POSTGRES_PASSWORD=postgres             -e POSTGRES_DB=postgres             -p 127.0.0.1:15432:5432             firecrawl-nuq-postgres-hardened
          for i in $(seq 1 60); do
            if docker exec nuq-hardening-test pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx nuq-hardening-test; then
              docker logs nuq-hardening-test || true
              exit 1
            fi
            sleep 1
          done
          docker exec nuq-hardening-test psql -U postgres -d postgres -Atc "select extname from pg_extension where extname='pg_cron'" | grep -qx pg_cron
          docker exec nuq-hardening-test psql -U postgres -d postgres -Atc "select to_regclass('nuq.queue_scrape') is not null" | grep -qx t
          docker logs nuq-hardening-test --tail 100
          docker stop nuq-hardening-test

      - name: Validate Compose overlay
        env:
          SEARXNG_SECRET: test-secret
        run: |
          touch .env
          docker compose             --project-directory "$GITHUB_WORKSPACE/upstream"             -f "$GITHUB_WORKSPACE/upstream/docker-compose.yaml"             -f "$GITHUB_WORKSPACE/compose.local.yaml"             config >/tmp/compose-rendered.yaml
          grep -F 'Dockerfile.api' /tmp/compose-rendered.yaml
          grep -F 'Dockerfile.playwright' /tmp/compose-rendered.yaml
          grep -F 'Dockerfile.nuq-postgres' /tmp/compose-rendered.yaml
