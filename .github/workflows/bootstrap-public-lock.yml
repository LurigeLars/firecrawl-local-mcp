name: Bootstrap public lock

on:
  push:
    branches:
      - security/axios-1.20.0-20261001

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/axios-1.20.0-20261001
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Refresh public lockfile
        run: |
          npm install --package-lock-only --prefix public --ignore-scripts
          if git diff --quiet -- public/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/package-lock.json
          git commit -m "security: refresh public lockfile"
          git push origin HEAD:security/axios-1.20.0-20261001
