name: One-time CodeQL triage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/triage-codeql-once.yml"

permissions:
  contents: read
  security-events: write

jobs:
  dismiss-test-alerts:
    if: github.repository == 'LurigeLars/firecrawl-local-mcp'
    runs-on: ubuntu-latest
    steps:
      - name: Mark intentional selftest SSRF probes as used in tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for alert in 8 6 5 4 3; do
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${alert}" \
              -f state='dismissed' \
              -f dismissed_reason='used in tests' \
              -f dismissed_comment='Reviewed 2026-09-25: public/selftest.mjs is an operator-run end-to-end diagnostic whose purpose is to probe the explicitly supplied gateway URL and negative paths. This is intentional test-only network behavior, not a production request path.'
          done
