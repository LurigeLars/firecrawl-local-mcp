name: Generate public npm lock

on:
  push:
    branches:
      - deps/coverage-watch-20260930
    paths:
      - public/package.json

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: deps/coverage-watch-20260930

      - name: Generate lockfile
        working-directory: public
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deps: lock public firecrawl-mcp runtime"
          git push origin HEAD:deps/coverage-watch-20260930
