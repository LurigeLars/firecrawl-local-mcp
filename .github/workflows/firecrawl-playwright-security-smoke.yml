name: Pinned Firecrawl Playwright security build

on:
  pull_request:
    branches: [main]
    paths:
      - 'security/Dockerfile.playwright-security'
      - 'compose.local.yaml'
      - 'upstream/firecrawl.json'
      - '.github/workflows/firecrawl-playwright-security-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-runtime:
    name: Pinned Playwright image build (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout pinned Firecrawl Playwright source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('upstream/firecrawl.json', encoding='utf-8'))
          assert p['repository']=='firecrawl/firecrawl'
          assert p['tag']=='v2.11.642'
          assert p['commit']=='7e6bd701febaacc3bb95c0fb7eee2c509a4813c5'
          PY
          git clone --filter=blob:none --no-checkout --depth 1 --branch v2.11.642 \
            https://github.com/firecrawl/firecrawl.git "$RUNNER_TEMP/firecrawl"
          git -C "$RUNNER_TEMP/firecrawl" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/firecrawl" sparse-checkout set apps/playwright-service-ts
          git -C "$RUNNER_TEMP/firecrawl" checkout --detach 7e6bd701febaacc3bb95c0fb7eee2c509a4813c5
          test "$(git -C "$RUNNER_TEMP/firecrawl" rev-parse HEAD)" = 7e6bd701febaacc3bb95c0fb7eee2c509a4813c5
          test -f "$RUNNER_TEMP/firecrawl/apps/playwright-service-ts/Dockerfile"
      - name: Assert wrapper Dockerfile differs only by reviewed OS security block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          upstream=Path(os.environ['RUNNER_TEMP'])/'firecrawl/apps/playwright-service-ts/Dockerfile'
          own=Path('security/Dockerfile.playwright-security')
          original=upstream.read_text(encoding='utf-8')
          replacement=own.read_text(encoding='utf-8')
          header='''# Wrapper-owned security override for pinned firecrawl/firecrawl v2.11.642.
          # Keep the upstream Playwright build steps and Node 22.23.4 base, but apply
          # available Debian security patches before installing browser dependencies.
          '''
          block='''RUN apt-get update \\
              && apt-get upgrade -y --no-install-recommends \\
              && apt-get install -y --no-install-recommends ca-certificates \\
              && update-ca-certificates \\
              && test -s /etc/ssl/certs/ca-certificates.crt \\
              && rm -rf /var/lib/apt/lists/*

          '''
          assert replacement.startswith(header)
          cleaned=replacement[len(header):]
          assert cleaned.count(block)==1, "Unexpected/absent reviewed Debian security block"
          cleaned=cleaned.replace(block,'',1)
          assert cleaned==original, "Wrapper Dockerfile drifted from the exact pinned upstream source"
          PY
      - name: Build pinned Playwright image with OS package upgrades
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f "$GITHUB_WORKSPACE/security/Dockerfile.playwright-security" \
            -t firecrawl-playwright-security-review:local \
            "$RUNNER_TEMP/firecrawl/apps/playwright-service-ts"
      - name: Verify Chromium and compiled API without opening ports
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh firecrawl-playwright-security-review:local -c '
            set -eu
            test -s /usr/src/app/dist/api.js
            node --version
            pnpm exec playwright --version
            test -d /usr/local/share/playwright
            test -s /etc/ssl/certs/ca-certificates.crt
          '
