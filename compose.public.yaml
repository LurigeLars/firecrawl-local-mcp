# Public ChatGPT access: firecrawl-mcp (HTTP) -> gateway -> shared Cloudflare Tunnel.
# Nothing here publishes a host port; the only way in is through the tunnel.
services:
  browser-session-service:
    networks: [browser_dualstack, browser_edge]

  mcp:
    build:
      context: ../public
      dockerfile: Dockerfile.mcp
    environment:
      FIRECRAWL_API_URL: http://api:3002
    networks: [backend, edge]
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp, /home/node]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  gateway:
    image: node:26.10.0-alpine
    command: ["node", "/app/gateway.mjs"]
    user: node
    env_file:
      - ../public/gateway.env
    environment:
      UPSTREAM_HOST: mcp
      UPSTREAM_PORT: "3000"
      # Cloudflare Access (Managed OAuth) is mandatory.
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:-}
      ACCESS_AUD: ${ACCESS_AUD:-}
      ACCESS_ALLOWED_EMAILS: ${ACCESS_ALLOWED_EMAILS:-}
      BROWSER_SERVICE_URL: http://browser-session-service:3010
      ALLOWED_TOOLS: firecrawl_scrape,firecrawl_map,firecrawl_search,firecrawl_crawl,firecrawl_check_crawl_status,firecrawl_browser_open,firecrawl_browser_list,firecrawl_browser_navigate,firecrawl_browser_tabs,firecrawl_browser_snapshot,firecrawl_browser_network,firecrawl_browser_console,firecrawl_browser_screenshot,firecrawl_browser_close
    volumes:
      - ../public/gateway:/app:ro
    networks:
      edge:
        aliases:
          - firecrawl-gateway
      browser_edge: {}
    depends_on: [mcp, browser-session-service]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped


networks:
  edge:
    driver: bridge
  browser_edge:
    driver: bridge
    internal: true
