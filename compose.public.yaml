# Public ChatGPT access: firecrawl-mcp (HTTP) -> gateway -> shared Cloudflare Tunnel.
# Nothing here publishes a host port; the only way in is through the tunnel.
services:
  mcp:
    build:
      context: ../public
      dockerfile: Dockerfile.mcp
    environment:
      FIRECRAWL_API_URL: http://api:3002
    networks: [backend, edge]
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp, /home/node]
    restart: unless-stopped

  gateway:
    image: node:26.10.0-alpine
    command:
      - sh
      - -c
      - >-
        while [ ! -s /run/firecrawl-gateway-secrets/browser_bridge_token ]; do sleep 0.05; done;
        exec node /app/gateway.mjs
    user: node
    env_file:
      - ../public/gateway.env
    environment:
      UPSTREAM_HOST: mcp
      UPSTREAM_PORT: "3000"
      # Cloudflare Access (Managed OAuth) is mandatory.
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:-}
      ACCESS_AUD: ${ACCESS_AUD:-}
      ACCESS_ALLOWED_EMAILS: ${ACCESS_ALLOWED_EMAILS:-}
      ALLOWED_TOOLS: firecrawl_scrape,firecrawl_map,firecrawl_search,firecrawl_crawl,firecrawl_check_crawl_status,browser_session_open,browser_session_status,browser_product_open,browser_snapshot,browser_network_log,browser_product_probe,browser_category_probe,browser_category_open
      BROWSER_BRIDGE_URL: http://host.docker.internal:${BROWSER_BRIDGE_PORT:-8766}
      BROWSER_BRIDGE_TOKEN_FILE: /run/firecrawl-gateway-secrets/browser_bridge_token
    volumes:
      - ../public/gateway:/app:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      edge:
        aliases:
          - firecrawl-gateway
    depends_on: [mcp]
    read_only: true
    tmpfs:
      - /run/firecrawl-gateway-secrets:rw,nosuid,nodev,noexec,size=64k,uid=1000,gid=1000,mode=0700
    post_start:
      - command:
          - sh
          - -c
          - >-
            umask 077;
            test -n "$$FIRECRAWL_BROWSER_BRIDGE_SECRET";
            printf '%s' "$$FIRECRAWL_BROWSER_BRIDGE_SECRET" > /run/firecrawl-gateway-secrets/browser_bridge_token
        environment:
          FIRECRAWL_BROWSER_BRIDGE_SECRET: ${FIRECRAWL_BROWSER_BRIDGE_SECRET:?Browser bridge runtime secret is required}
    restart: unless-stopped


networks:
  edge:
    driver: bridge
