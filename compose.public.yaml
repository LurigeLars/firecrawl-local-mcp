# Public ChatGPT access: firecrawl-mcp (HTTP) -> secret-path gateway -> Cloudflare Tunnel.
# Nothing here publishes a host port; the only way in is through the tunnel.
services:
  mcp:
    build:
      context: ../public
      dockerfile: Dockerfile.mcp
    environment:
      FIRECRAWL_API_URL: http://api:3002
    networks: [backend, edge]
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp, /home/node]
    restart: unless-stopped

  gateway:
    image: node:26.9.0-alpine
    command: ["node", "/app/gateway.mjs"]
    user: node
    env_file:
      - ../public/gateway.env
      - ../public/browser.env
    environment:
      UPSTREAM_HOST: mcp
      UPSTREAM_PORT: "3000"
      # Cloudflare Access (Managed OAuth). Empty ACCESS_AUD = off (secret-path only).
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:-}
      ACCESS_AUD: ${ACCESS_AUD:-}
      ACCESS_ALLOWED_EMAILS: ${ACCESS_ALLOWED_EMAILS:-}
      # Emergency fallback only: without ACCESS_AUD the gateway refuses to start unless this is 1.
      ALLOW_SECRET_PATH: ${ALLOW_SECRET_PATH:-}
      ALLOWED_TOOLS: firecrawl_scrape,firecrawl_map,firecrawl_search,firecrawl_crawl,firecrawl_check_crawl_status,browser_session_open,browser_session_status,browser_product_open,browser_snapshot,browser_network_log,browser_product_probe
      BROWSER_BRIDGE_URL: http://host.docker.internal:${BROWSER_BRIDGE_PORT:-8766}
    volumes:
      - ../public/gateway:/app:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [edge]
    depends_on: [mcp]
    read_only: true
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ../.cloudflared:/etc/cloudflared:ro
    networks: [edge]
    depends_on: [gateway]
    restart: unless-stopped

networks:
  edge:
    driver: bridge